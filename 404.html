  <script>
    async function fetchData() {
        try {
            //一日目
            const response = await fetch('https://script.google.com/macros/s/AKfycbw9Tu39j5TfJCQGg1Kp95HAsfQWSqG2q3PEAd8rLC5WnH-xfjktwgblIvKH2MHxNU7ZhA/exec');
            //二日目
            // const response = await fetch('https://script.google.com/macros/s/AKfycbzMT7oAta7S9gUJCWbt68iwYdILhTjqxKCJqJ6b_uJtAVUl03OdLKqzVslnUwhE3bZw/exec');
            const data = await response.json();
            document.getElementById('sheetDataB3').innerText = data.valueB3;
            document.getElementById('sheetDataB18').innerText = data.valueB18;
            document.getElementById('sheetDataI3').innerText = data.valueI3;
            document.getElementById('sheetDataI4').innerText = data.valueI4;

            // TODO:準備中ここかえる
            // document.getElementById('sheetDataB3').innerText = "準備中";
            // document.getElementById('sheetDataB18').innerText = "準備中";

            // sheetDataB4,19の加工
            let sheetDataB4 = data.valueB4;
            sheetDataB4 = sheetDataB4.replace("1899-12-29T15:", "").replace(":00.000Z", "").replace("00:", "").replace(":00", "").replace("00","0").replace("05","5");
            document.getElementById('sheetDataB4').innerText = sheetDataB4;
            let sheetDataB19 = data.valueB19;
            sheetDataB19 = sheetDataB19.replace("1899-12-29T15:", "").replace(":00.000Z", "").replace("00:", "").replace(":00", "").replace("00","0").replace("05","5");
            document.getElementById('sheetDataB19').innerText = sheetDataB19;

        } catch (error) {
            console.error('Error fetching data:', error);
        }
    }

    window.onload = fetchData;
  </script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      let infobars = document.querySelectorAll('.top_Infobar');
      let currentIndex = 0;
  
      setInterval(() => {
        // 全てのInfobarを非表示にする
        infobars.forEach(infobar => infobar.style.display = 'none');
        
        // 現在のインデックスのInfobarを表示する
        infobars[currentIndex].style.display = 'block';
  
        // インデックスを切り替える
        currentIndex = (currentIndex + 1) % infobars.length;
      }, 4000); // 4秒ごとに切り替え
    });
  </script>
