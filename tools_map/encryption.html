<!DOCTYPE html>

<head>
  <meta charset="utf-8" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/core.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/enc-base64.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/cipher-core.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/sha256.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/sha1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/aes.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/hmac.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/pbkdf2.min.js"></script>

  <script>
    const salt = CryptoJS.lib.WordArray.random(128 / 8);
    const iv = CryptoJS.lib.WordArray.random(128 / 8);

    function encrypt(text, pass) {
      const key = CryptoJS.PBKDF2(pass, salt, {
        keySize: 128 / 32,
        iterations: 50000,
        hasher: CryptoJS.algo.SHA256,
      });

      const encrypted = CryptoJS.AES.encrypt(text, key, {
        iv: iv,
      });

      return_data = [salt, iv, encrypted]
      return (
        return_data
      );
    }
  </script>
</head>

<body>
  <form id="code_form">
    変換したいコード：<input type="text" id="code">
    パスワード：<input type="text" id="password">
  </form>
  <button onclick="change()">実行</button>
  <script>
    function change() {
      if (code_form.code.value == "") {
        alert("変換したいコードを入力してください");
        return false;
      } else {
        const formElm = document.getElementById("code_form");
        var code = formElm.code.value;
        if (code_form.password.value == "") {
          alert("パスワードを入力してください");
          return false;
        } else {
          password_asd = formElm.password.value;
          console.log(password_asd);
          const passPhrase = password_asd;
          const encryptedData = encrypt(code, passPhrase);
          console.log("salt");
          console.log(encryptedData[0]);
          console.log("iv");
          console.log(encryptedData[1]);
          console.log("code");
          console.log(encryptedData[2]);
        }
      }
    }
  </script>
</body>

</html>
